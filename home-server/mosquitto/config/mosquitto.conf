listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
# Save retained messages to flash every 30 min, not on every change: spares the eMMC
autosave_interval 1800

# Log to docker (docker compose logs mosquitto) instead of a file on the eMMC
log_dest stdout
