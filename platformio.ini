; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Bài đang học – đổi giá trị này khi chuyển sang bài mới
default_envs = lesson01

; Cấu hình chung cho mọi môi trường
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800  ; 921600 bị lỗi "Unable to verify flash chip connection" trên board này

; Sân chơi tự do – dùng code trong src/
[env:esp32dev]

; ===== Các bài học trong thư mục lession/ =====
[env:lesson01]
build_src_filter = +<../lession/01-hello-esp32/> -<../lession/01-hello-esp32/bai-tap-sos/>

; Bài tập 2 của bài 01 – nháy SOS
[env:lesson01_sos]
build_src_filter = +<../lession/01-hello-esp32/bai-tap-sos/>
