; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Current lesson – change this when you move to a new lesson
default_envs = lesson03

; Shared settings for every environment
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800  ; 921600 fails with "Unable to verify flash chip connection" on this board

; Free playground – builds the code in src/
[env:esp32dev]

; ===== Lessons in the lession/ folder =====
[env:lesson01]
build_src_filter = +<../lession/01-hello-esp32/> -<../lession/01-hello-esp32/exercise-sos/>

; Lesson 01, exercise 2 – SOS blink
[env:lesson01_sos]
build_src_filter = +<../lession/01-hello-esp32/exercise-sos/>

[env:lesson02]
build_src_filter = +<../lession/02-button/>

[env:lesson03]
build_src_filter = +<../lession/03-millis/> -<../lession/03-millis/blocking-demo/>

; Lesson 03 wrong-way demo – delay() makes button presses get missed
[env:lesson03_blocking]
build_src_filter = +<../lession/03-millis/blocking-demo/>
